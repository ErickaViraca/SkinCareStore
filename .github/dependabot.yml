# Dependabot: propone pull requests para actualizar dependencias y avisa de
# vulnerabilidades conocidas. Cada PR pasa por el CI antes de poder mergearse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
